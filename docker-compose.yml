# =============================================================================
# Job Processing Platform - Docker Compose
# =============================================================================
# Multi-service deployment with:
# - API service (2 replicas for load balancing)
# - Worker service
# - PostgreSQL database
# - Redis cache/queue
# - Nginx gateway
# =============================================================================

version: "3.8"

services:
  # ===========================================================================
  # Nginx Gateway
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: job-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
    networks:
      - job-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # API Service - Replica 1
  # ===========================================================================
  api-1:
    build:
      context: ./platform/api
      dockerfile: Dockerfile
    container_name: job-api-1
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/jobsystem
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_REQUESTS_PER_MINUTE=60
      - RATE_LIMIT_BURST_SIZE=10
      - CACHE_ENABLED=true
      - CACHE_TTL_SECONDS=300
      - JOB_QUEUE_NAME=job_queue
      - DEBUG=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - job-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # API Service - Replica 2
  # ===========================================================================
  api-2:
    build:
      context: ./platform/api
      dockerfile: Dockerfile
    container_name: job-api-2
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/jobsystem
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_REQUESTS_PER_MINUTE=60
      - RATE_LIMIT_BURST_SIZE=10
      - CACHE_ENABLED=true
      - CACHE_TTL_SECONDS=300
      - JOB_QUEUE_NAME=job_queue
      - DEBUG=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - job-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # Worker Service
  # ===========================================================================
  worker-1:
    build:
      context: ./platform/worker
      dockerfile: Dockerfile
    container_name: job-worker-1
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/jobsystem
      - REDIS_URL=redis://redis:6379/0
      - WORKER_ID=worker-1
      - JOB_QUEUE_NAME=job_queue
      - QUEUE_POLL_TIMEOUT=5
      - MAX_RETRIES=3
      - PROCESSING_TIMEOUT=300
      - CACHE_ENABLED=true
      - CACHE_TTL_SECONDS=300
      # Groq API (SupportRAG LLM provider)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_REQUESTS_PER_MINUTE=${GROQ_REQUESTS_PER_MINUTE:-30}
      - GROQ_TOKENS_PER_MINUTE=${GROQ_TOKENS_PER_MINUTE:-6000}
      # Vector store — set false on Linux too for safety
      - USE_VECTOR_STORE_IVF=false
      - DEBUG=false
    volumes:
      # Mount SupportRAG so the pipeline can load data + vector stores
      - .:/supportrag:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - job-network
    restart: unless-stopped

  # ===========================================================================
  # Worker Service - Replica 2 (Optional scaling)
  # ===========================================================================
  worker-2:
    build:
      context: ./platform/worker
      dockerfile: Dockerfile
    container_name: job-worker-2
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/jobsystem
      - REDIS_URL=redis://redis:6379/0
      - WORKER_ID=worker-2
      - JOB_QUEUE_NAME=job_queue
      - QUEUE_POLL_TIMEOUT=5
      - MAX_RETRIES=3
      - PROCESSING_TIMEOUT=300
      - CACHE_ENABLED=true
      - CACHE_TTL_SECONDS=300
      # Groq API (SupportRAG LLM provider)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_REQUESTS_PER_MINUTE=${GROQ_REQUESTS_PER_MINUTE:-30}
      - GROQ_TOKENS_PER_MINUTE=${GROQ_TOKENS_PER_MINUTE:-6000}
      - USE_VECTOR_STORE_IVF=false
      - DEBUG=false
    volumes:
      - .:/supportrag:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - job-network
    restart: unless-stopped

  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: job-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=jobsystem
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Expose for local development
    networks:
      - job-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobsystem"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Redis Cache & Queue
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: job-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"  # Expose for local development
    networks:
      - job-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# =============================================================================
# Networks
# =============================================================================
networks:
  job-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
  redis_data:
